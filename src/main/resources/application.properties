# ============================================================
# Cấu hình MẶC ĐỊNH: chạy local với H2 (database file, không cần cài gì)
# Dữ liệu lưu tại ./data/in3d.mv.db
# Nối Supabase PostgreSQL: chạy kèm --spring.profiles.active=supabase
# ============================================================
# 8090 vì cổng 8080 thường bị Apache/XAMPP chiếm
server.port=8090

spring.datasource.url=jdbc:h2:file:./data/in3d;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ============================================================
# LƯU ẢNH SẢN PHẨM — miễn phí, ghi thẳng xuống ổ đĩa
# Ảnh nằm ở ./data/anh, xem được tại http://localhost:8090/anh/<ten-file>
# Muốn đổi chỗ lưu: in3d.thu-muc-anh=D:/anh-in3d
# Muốn dùng CDN/Supabase Storage: đọc HUONG-DAN-LUU-ANH.md
# ============================================================
in3d.thu-muc-anh=./data/anh
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ============================================================
# GỬI EMAIL OTP QUA GMAIL
# Đặt 2 biến môi trường trước khi chạy (KHÔNG ghi mật khẩu vào file này):
#   PowerShell:
#     $env:GMAIL_USER = "txp5201aquarius@gmail.com"
#     $env:GMAIL_APP_PASSWORD = "abcd efgh ijkl mnop"   (App Password 16 ký tự)
# Lấy App Password: https://myaccount.google.com/apppasswords
#   (cần bật Xác minh 2 bước cho tài khoản Google trước)
# Chưa cấu hình -> backend KHÔNG gửi email, mã OTP in ra console để thử.
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

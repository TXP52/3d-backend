# ============================================================
# IN3D Shop — cấu hình backend
# DATABASE: Supabase PostgreSQL (không còn H2).
#
# HOST + MẬT KHẨU ĐIỀN Ở FILE RIÊNG: application-supabase.properties
# (file đó bị gitignore nên mật khẩu không lên GitHub; nó ĐÈ LÊN các dòng dưới).
# Các dòng dưới chỉ là giá trị "chưa điền" để khi thiếu file kia, backend vẫn
# dựng được DataSource rồi dừng kèm hướng dẫn tiếng Việt thay vì lỗi Spring khó hiểu.
# ============================================================
spring.profiles.active=supabase

spring.datasource.url=jdbc:postgresql://<chua-dien-host-pooler>:5432/postgres
spring.datasource.username=postgres.nmptxzbtngztzxpwdprs
spring.datasource.password=<chua-dien-mat-khau>
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# 8090 vì cổng 8080 thường bị Apache/XAMPP chiếm
server.port=8090

spring.jpa.open-in-view=false

# Database ở xa (~300 ms mỗi truy vấn) nên tránh N+1: collection lười (chi tiết đơn,
# thanh toán) nạp theo lô 100 đơn một truy vấn thay vì mỗi đơn một truy vấn.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# Pool kết nối: giữ kết nối tới Supabase ấm (pooler bên đó hay cắt kết nối rảnh)
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1500000

# Nén JSON trả về cho nhẹ đường truyền
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ============================================================
# LƯU ẢNH SẢN PHẨM — ghi vào thư mục CỦA TRANG QUẢN TRỊ: 3d/public/anh
# (cạnh các file html của trang quản trị, để ảnh đi theo project đó, không bị gitignore).
# Backend vẫn phục vụ tại http://localhost:8090/anh/<ten-file>; server tĩnh của trang
# quản trị (cổng 8124) cũng thấy cùng file tại /anh/<ten-file>.
# Đường dẫn tương đối tính từ thư mục chạy backend (IntelliJ: gốc 3d-backend; chạy jar
# thì cd vào 3d-backend trước). Lúc khởi động backend in ra đường dẫn tuyệt đối để đối chiếu.
# Muốn dùng CDN/Supabase Storage: đọc HUONG-DAN-LUU-ANH.md
# ============================================================
in3d.thu-muc-anh=../3d/public/anh
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


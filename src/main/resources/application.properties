spring.profiles.active=supabase

spring.datasource.url=jdbc:postgresql://<chua-dien-host-pooler>:5432/postgres
spring.datasource.username=postgres.nmptxzbtngztzxpwdprs
spring.datasource.password=<chua-dien-mat-khau>
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Render (và hầu hết máy chủ thuê) tự chọn cổng rồi báo qua biến môi trường PORT.
# Ở máy nhà không có biến đó nên vẫn là 8090 như cũ.
server.port=${PORT:8090}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Chỗ để ảnh khách tải lên. Máy nhà: thư mục public/anh của trang quản trị.
# Trên máy chủ thuê: khai IN3D_THU_MUC_ANH trỏ vào ổ đĩa gắn thêm, vì đĩa mặc
# định bị xoá sạch mỗi lần dịch vụ khởi động lại.
in3d.thu-muc-anh=${IN3D_THU_MUC_ANH:../3d/public/anh}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

in3d.admin.email=${IN3D_ADMIN_EMAIL:txp5201aquarius@gmail.com}

# Những trang web được phép gọi API này. Máy nhà để "*"; lên máy chủ thì khai
# IN3D_CORS_ORIGINS bằng đúng địa chỉ trang của mình (xem CorsConfig.java).
in3d.cors.origins=${IN3D_CORS_ORIGINS:*}

# Chìa khoá ký token đăng nhập. BẮT BUỘC khai IN3D_AUTH_SECRET trên máy chủ:
# để nguyên chuỗi mặc định thì ai đọc mã nguồn cũng tự ký được token admin.
in3d.auth.secret=${IN3D_AUTH_SECRET:doi-secret-nay-khi-len-production}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

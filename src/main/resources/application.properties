# ============================================================
# IN3D Shop — cấu hình backend
#
# DATABASE: Supabase PostgreSQL. Không còn H2 nữa.
# Thông tin kết nối (host, user, MẬT KHẨU) nằm ở file riêng:
#     src/main/resources/application-supabase.properties
# File đó bị gitignore vì chứa mật khẩu database, nên không lên GitHub.
# Chưa có file: copy application-supabase.properties.example rồi điền vào.
#
# Dòng dưới bật sẵn profile supabase nên chạy thẳng là được,
# không phải gõ --spring.profiles.active=supabase như trước.
# ============================================================
spring.profiles.active=supabase

# 8090 vì cổng 8080 thường bị Apache/XAMPP chiếm
server.port=8090

spring.jpa.open-in-view=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ============================================================
# LƯU ẢNH SẢN PHẨM — miễn phí, ghi thẳng xuống ổ đĩa
# Ảnh nằm ở ./data/anh, xem được tại http://localhost:8090/anh/<ten-file>
# Muốn đổi chỗ lưu: in3d.thu-muc-anh=D:/anh-in3d
# Muốn dùng CDN/Supabase Storage: đọc HUONG-DAN-LUU-ANH.md
# ============================================================
in3d.thu-muc-anh=./data/anh
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ============================================================
# GỬI EMAIL OTP QUA GMAIL
# Đặt 2 biến môi trường trước khi chạy (KHÔNG ghi mật khẩu vào file này):
#   PowerShell:
#     $env:GMAIL_USER = "txp5201aquarius@gmail.com"
#     $env:GMAIL_APP_PASSWORD = "abcd efgh ijkl mnop"   (App Password 16 ký tự)
# Lấy App Password: https://myaccount.google.com/apppasswords
#   (cần bật Xác minh 2 bước cho tài khoản Google trước)
# Chưa cấu hình -> backend KHÔNG gửi email, mã OTP in ra console để thử.
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USER:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# ============================================================
# MAU cau hinh cho MAY SERVER.
#
# Chep file nay thanh:  <thu muc repo>\config\application-supabase.properties
# roi dien thong tin that. Thu muc config\ da bi .gitignore chan nen khong bao gio
# len GitHub — mat khau database chi nam tren may server.
#
# Spring Boot tu doc thu muc config\ canh cho chay, khong can khai gi them.
# ============================================================

# --- Database Supabase ---
# Lay o: Supabase > Project Settings > Database > Connection string > URI.
# Nho dung dia chi POOLER (co chu "pooler" trong ten), dung dung db.xxx.supabase.co.
# Doi dau "postgresql://" thanh "jdbc:postgresql://" va bo phan user:matkhau ra ngoai.
# Cach chac an nhat: mo file dang chay o may nha
#   D:\3d\3d-backend\src\main\resources\application-supabase.properties
# roi chep nguyen 3 dong url / username / password sang day.
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?tcpKeepAlive=true&reWriteBatchedInserts=true&ApplicationName=in3d-backend&assumeMinServerVersion=17
spring.datasource.username=postgres.nmptxzbtngztzxpwdprs
spring.datasource.password=DIEN-MAT-KHAU-VAO-DAY

# --- Chia khoa ky token dang nhap ---
# BAT BUOC doi. De nguyen chuoi mac dinh thi ai doc ma nguon cung tu ky duoc
# token admin. Tu nghi mot chuoi dai ngau nhien, hoac sinh bang lenh:
#   [Convert]::ToBase64String((1..48 | ForEach-Object { Get-Random -Max 256 }))
in3d.auth.secret=DIEN-MOT-CHUOI-DAI-NGAU-NHIEN-VAO-DAY

# --- Trang nao duoc phep goi API nay ---
# Ngan cach bang dau phay, khong co dau / o cuoi. Vi du khi da deploy:
#   https://txp52.github.io
# De "*" thi trang nao cung goi duoc — chi nen dung luc dang thu.
in3d.cors.origins=https://txp52.github.io

# --- Cho de anh khach tai len ---
# Tren may server khong co thu muc ../3d/public/anh nhu may nha. Tro vao mot thu
# muc co that, backend tu tao neu chua co. Dung dau / chu khong phai \.
in3d.thu-muc-anh=C:/Users/Admin/Website/anh

# --- Email duoc vao trang quan tri ---
